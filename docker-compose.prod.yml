# ==============================================================================
# Compose de PRODUÇÃO (VPS + domínio público) — ver GUIA_DEPLOY.md.
#
# Diferenças em relação ao docker-compose.yml (uso local/rede interna):
#   - O container "web" NÃO publica porta nenhuma para fora do servidor
#     (usa "expose", não "ports") — só o Caddy fica exposto à internet
#     (portas 80/443). Ninguém alcança o Gunicorn diretamente.
#   - Novo serviço "caddy": proxy reverso com HTTPS automático (Let's
#     Encrypt) — só precisa do domínio configurado no Caddyfile.
#
# Uso (na VPS, depois de configurar .env e Caddyfile — ver GUIA_DEPLOY.md):
#   docker compose -f docker-compose.prod.yml up -d --build
# ==============================================================================
services:
  web:
    build: .
    image: email-signature-system:v1
    container_name: email_signature_system
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${PORT:-5002}"
    volumes:
      - signature_instance:/app/instance
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${PORT:-5002}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: email_signature_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  signature_instance:
  caddy_data:
  caddy_config:
